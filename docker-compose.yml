services:
  timescaledb:
    # Версия зафиксирована: расширение в томе нельзя открыть более старым образом.
    image: timescale/timescaledb:2.30.2-pg16
    container_name: sensoterra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Опубликован для локальной разработки (./gradlew run на хосте).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    image: sensoterra-server
    container_name: sensoterra-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Внутри сети compose БД доступна по имени сервиса, DB_URL из .env (localhost) не используется.
      DB_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Client ID должен быть уникален на брокере: два клиента с одним ID выбивают друг друга.
      # Unset in .env = the same default broker as in application.yml.
      SENSOTERRA_MQTT_BROKER: ${SENSOTERRA_MQTT_BROKER:-ssl://m6.wqtt.ru:19395}
      SENSOTERRA_MQTT_CLIENT_ID: ${SENSOTERRA_MQTT_CLIENT_ID:-sensoterra-server-1}
      SENSOTERRA_MQTT_USERNAME: ${SENSOTERRA_MQTT_USERNAME:-}
      SENSOTERRA_MQTT_PASSWORD: ${SENSOTERRA_MQTT_PASSWORD:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      YANDEX_OAUTH_ENABLED: ${YANDEX_OAUTH_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    healthcheck:
      # GET /health over bash /dev/tcp (the JRE image has no curl): 200 = DB up (MQTT may be DEGRADED).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  client:
    build: ./client
    image: sensoterra-client
    container_name: sensoterra-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"

volumes:
  timescale-data:
