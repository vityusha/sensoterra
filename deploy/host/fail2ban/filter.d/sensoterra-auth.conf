# Неудачные входы в Sensoterra по access log host nginx (формат combined):
#   1.2.3.4 - - [21/Oct/2026:12:00:00 +0000] "POST /api/auth/login HTTP/2.0" 401 54 "..." "..."
# Эндпоинты: login, oauth/google, смена пароля, bootstrap первого админа.
# Статусы: 401 неверный пароль, 403 отключённый аккаунт / админ уже есть, 429 limit_req nginx.
# Проверка: fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/sensoterra-auth.conf

[Definition]
# Дату fail2ban вырезает из строки до сопоставления: от [21/Oct/2026:...] остаётся [].
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "(?:POST|PUT) /api/auth/(?:login|oauth/google|password|bootstrap)(?:\?\S*)? HTTP/[\d.]+" (?:401|403|429)
ignoreregex =
