# Failed Sensoterra logins in the host nginx access log (combined format):
#   1.2.3.4 - - [21/Oct/2026:12:00:00 +0000] "POST /api/auth/login HTTP/2.0" 401 54 "..." "..."
# Endpoints: login, oauth/google, oauth/yandex, password change, first-admin bootstrap.
# Statuses: 401 wrong password, 403 disabled account / admin already exists, 429 nginx limit_req.
# Test: fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/sensoterra-auth.conf

[Definition]
# fail2ban cuts the date out of the line before matching: [21/Oct/2026:...] becomes [].
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "(?:POST|PUT) /api/auth/(?:login|oauth/(?:google|yandex)|password|bootstrap)(?:\?\S*)? HTTP/[\d.]+" (?:401|403|429)
ignoreregex =
