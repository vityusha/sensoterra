# Шаблон сайта для nginx на хосте VPS (reverse proxy + TLS перед docker compose).
# Установка (порядок важен: блок 443 ссылается на сертификат, без него nginx -t падает):
#   1. Сначала только получить сертификат, не трогая конфиг:
#        sudo certbot certonly --nginx -d sensoterra.example.ru
#   2. Поставить сайт с заменой домена (и порта 3000, если в .env другой APP_PORT):
#        sed 's/sensoterra.example.ru/ВАШ_ДОМЕН/g' deploy/nginx-host.conf \
#          | sudo tee /etc/nginx/sites-available/sensoterra >/dev/null
#        sudo ln -sf /etc/nginx/sites-available/sensoterra /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Проверить автопродление: sudo certbot renew --dry-run
# `certbot --nginx` без certonly здесь не нужен: пути к сертификату уже прописаны ниже.
#
# Клиент опубликован только на 127.0.0.1:3000 (docker-compose.prod.yml), его nginx
# проксирует /api и /ws дальше на server:8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Защита от перебора паролей: 5 попыток входа в минуту с одного IP.
limit_req_zone $binary_remote_addr zone=sensoterra_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sensoterra.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1. На более старом (Ubuntu 24.04 — 1.24) убрать эту строку
    # и писать `listen 443 ssl http2;`.
    http2 on;
    server_name sensoterra.example.ru;

    ssl_certificate     /etc/letsencrypt/live/sensoterra.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensoterra.example.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    # Host обязателен: Micronaut сверяет его с Origin, иначе вход падает с 403.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/login {
        limit_req zone=sensoterra_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # WebSocket live-статусов. JWT передаётся в ?token= — в access log не пишем.
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        access_log off;
    }
}
