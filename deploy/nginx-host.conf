# Шаблон сайта для nginx на хосте VPS (reverse proxy + TLS перед docker compose).
# Установка:
#   1. Заменить sensoterra.example.ru на свой домен (и порт 3000, если в .env другой APP_PORT).
#   2. sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/sensoterra
#      sudo ln -s /etc/nginx/sites-available/sensoterra /etc/nginx/sites-enabled/
#   3. Сертификат: sudo certbot --nginx -d sensoterra.example.ru
#      (certbot сам пропишет пути; ниже — пути по умолчанию Let's Encrypt).
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Клиент опубликован только на 127.0.0.1:3000 (docker-compose.prod.yml), его nginx
# проксирует /api и /ws дальше на server:8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Защита от перебора паролей: 5 попыток входа в минуту с одного IP.
limit_req_zone $binary_remote_addr zone=sensoterra_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sensoterra.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sensoterra.example.ru;

    ssl_certificate     /etc/letsencrypt/live/sensoterra.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensoterra.example.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    # Host обязателен: Micronaut сверяет его с Origin, иначе вход падает с 403.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/login {
        limit_req zone=sensoterra_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # WebSocket live-статусов. JWT передаётся в ?token= — в access log не пишем.
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        access_log off;
    }
}
