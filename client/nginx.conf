map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS Docker: адрес сервера резолвится на каждый запрос, переживает пересоздание контейнера.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8080;

    location /api/ {
        proxy_pass $backend;
        # Host/Origin должны совпадать, иначе CORS-фильтр Micronaut отбивает запрос 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Micronaut health (DB, disk, MQTT). A 200 here means the whole chain works: host nginx,
    # this nginx, the server and the database; 502 means the client is up but the server is not.
    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Authorization header passes through as is: with a JWT the response includes details.
        add_header Cache-Control "no-store";
    }

    location /ws/ {
        # The JWT is in ?token= (browsers can't send headers on WebSocket): never log it.
        access_log off;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Хэшированные бандлы Vite — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker и точка входа всегда свежие, иначе после деплоя висит старая версия.
    location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Манифест PWA: в стандартном mime.types нет .webmanifest, иначе уходит как octet-stream.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA на createWebHistory: неизвестные пути отдаём index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
