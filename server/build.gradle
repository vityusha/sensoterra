plugins {
    id("io.micronaut.application") version "4.4.3"
    id("java")
}

version = "1.0.0"
group = "ru.sensoterra"


repositories {
    mavenCentral()
}

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("ru.sensoterra.*")
    }
}

dependencies {
    implementation("io.micronaut:micronaut-runtime")
    implementation("io.micronaut:micronaut-http-server-netty")
    implementation("io.micronaut.serde:micronaut-serde-jackson")

    // WebSocket
    implementation("io.micronaut:micronaut-websocket")

    // Reactor (reactive streams for security)
    implementation("io.micronaut.reactor:micronaut-reactor")

    // Security / JWT
    implementation("io.micronaut.security:micronaut-security")
    implementation("io.micronaut.security:micronaut-security-jwt")

    // Database
    implementation(platform("io.micronaut.sql:micronaut-sql-bom:5.8.3"))
    implementation("io.micronaut.data:micronaut-data-jpa")
    runtimeOnly("io.micronaut.data:micronaut-data-hibernate-jpa")
    implementation("io.micronaut.sql:micronaut-jdbc-hikari")
    implementation("io.micronaut.flyway:micronaut-flyway")
    implementation("org.flywaydb:flyway-database-postgresql:10.10.0")
    implementation("org.postgresql:postgresql")

    // MQTT
    implementation("org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5")

    // Password hashing
    implementation("org.mindrot:jbcrypt:0.4")

    compileOnly("org.graalvm.nativeimage:svm")
    compileOnly("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.projectlombok:lombok:1.18.34")
    annotationProcessor("io.micronaut.data:micronaut-data-processor")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")

    runtimeOnly("ch.qos.logback:logback-classic")
    runtimeOnly("org.yaml:snakeyaml")
    runtimeOnly("io.micronaut.sql:micronaut-hibernate-jpa")

    // Test
    testImplementation("io.micronaut.test:micronaut-test-junit5")
    testImplementation("io.micronaut:micronaut-http-client")
    testImplementation("org.mockito:mockito-core:5.12.0")
    testRuntimeOnly("com.h2database:h2")
    testAnnotationProcessor("io.micronaut:micronaut-inject-java")
}

application {
    mainClass.set("ru.sensoterra.server.Application")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
