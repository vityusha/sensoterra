micronaut:
  application:
    name: sensoterra-server
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        all:
          allowed-origins:
            - "http://localhost:3000"
            - "http://127.0.0.1:3000"
            - "http://10.0.3.130:3000"
          # Приватные сети (телефон/ноут в локалке) — чтобы работало и после смены IP по DHCP.
          # Наличие regex снимает защиту Micronaut от drive-by localhost: иначе origin != localhost
          # при Host=localhost:8080 (serve.py переписывает Host) отбивается 403.
          # Авторизация только bearer-токеном, cookie не используются — CSRF-риска нет.
          allowed-origins-regex: 'https?://(localhost|127\.0\.0\.1|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})(:[0-9]{1,5})?'
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowedHeaders:
            - "*"
            - Authorization
  security:
    enabled: true
    authentication: bearer
    endpoints:
      login:
        # Встроенный /login Micronaut отдаёт JWT мимо нашего AuthController — лишняя
        # точка входа. Вход только через /api/auth/login (там свои проверки и единый формат).
        enabled: false
    token:
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET}"
              jws-algorithm: HS256
        claims:
          issuer: "sensoterra-server"

endpoints:
  # micronaut-management is here only for /health; /env, /beans, /loggers etc. stay off.
  all:
    enabled: false
  health:
    enabled: true
    # Anonymous callers (uptime monitors, docker healthcheck) see only the overall status;
    # component details (DB version, disk, MQTT broker) need a JWT.
    sensitive: false
    details-visible: AUTHENTICATED
    status:
      http-mapping:
        # MQTT lost (see MqttHealthIndicator): still serving, must not fail healthchecks.
        DEGRADED: 200
        DOWN: 503

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/sensoterra`}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    maximum-pool-size: 10

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

jpa:
  default:
    entity-scan:
      packages:
        - "ru.sensoterra.server"
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false

sensoterra:
  oauth:
    # Вход через Google. Выключен по умолчанию: без client-id и без HTTPS кнопка
    # на фронте не показывается (см. /api/auth/status -> googleEnabled).
    # Client ID — публичный идентификатор, секретов на сервере нет.
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      # Адрес публичных ключей Google. Переопределяется в тестах на локальный сервер.
      # Дефолт в обратных кавычках: иначе Micronaut читает "https" как ещё один
      # плейсхолдер и отдаёт "//www.googleapis.com/..." без протокола.
      jwks-url: ${GOOGLE_JWKS_URL:`https://www.googleapis.com/oauth2/v3/certs`}
    # Yandex ID sign-in, off by default. Needs both client id and secret (authorization
    # code flow: the server exchanges the code itself). Redirect URI registered at
    # oauth.yandex.ru must be <site origin>/oauth/yandex.
    yandex:
      enabled: ${YANDEX_OAUTH_ENABLED:false}
      client-id: ${YANDEX_CLIENT_ID:}
      client-secret: ${YANDEX_CLIENT_SECRET:}
  invite:
    # Срок жизни ссылки-приглашения на доступ к устройству, дней.
    ttl-days: 7
  mqtt:
    # Defaults with ':' must stay backtick-quoted, otherwise Micronaut drops the part after it.
    broker: "${SENSOTERRA_MQTT_BROKER:`ssl://m6.wqtt.ru:19395`}"
    # Must be unique per running server: two clients with one ID keep kicking each other off.
    client-id: "${SENSOTERRA_MQTT_CLIENT_ID:sensoterra-server-1}"
    username: "${SENSOTERRA_MQTT_USERNAME}"
    password: "${SENSOTERRA_MQTT_PASSWORD}"
    keep-alive-interval: 60
    connection-timeout: 10
